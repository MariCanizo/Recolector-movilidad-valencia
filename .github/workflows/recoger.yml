name: Recoger datos de movilidad

on:
  schedule:
    # Cada 10 minutos, en minutos que no son el 0 ni el 30 (UTC).
    # Esos dos coinciden con el pico de GitHub Actions y el disparo se descarta
    # sin dejar un run fallido. El horario solo corre en la rama por defecto.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: recolector
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recoger
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
        run: |
          # Los horarios GTFS solo hace falta comprobarlos una vez al día (a las 4:00 UTC)
          if [ "$(date -u +%H%M)" \< "0410" ] && [ "$(date -u +%H)" = "04" ]; then
            python recolector.py
          else
            python recolector.py --fuentes valenbisi trafico meteo renfe
          fi
      - name: Guardar en el repositorio
        run: |
          git config user.name "recolector-bot"
          git config user.email "recolector-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin datos nuevos"
            exit 0
          fi
          git commit -m "Datos $(date -u +'%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push fallido (intento ${attempt}); reintento"
            sleep $((attempt * 3))
          done
          echo "No se pudo guardar los datos en el repositorio"
          exit 1
