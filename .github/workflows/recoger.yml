name: Recoger datos de movilidad

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: recolector
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recoger
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
        run: |
          # Los horarios GTFS solo hace falta comprobarlos una vez al día (a las 4:00 UTC)
          if [ "$(date -u +%H%M)" \< "0410" ] && [ "$(date -u +%H)" = "04" ]; then
            python recolector.py
          else
            python recolector.py --fuentes valenbisi trafico meteo renfe
          fi
      - name: Guardar en el repositorio
        run: |
          git config user.name "recolector-bot"
          git config user.email "recolector-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Datos $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
